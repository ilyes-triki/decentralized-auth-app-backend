spring.application.name=backend
# Clear failed Flyway rows / checksum drift on startup (local H2). Disable in production (see application-postgres.properties).
app.flyway.repair-before-migrate=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
app.auth.admin-wallets=${APP_AUTH_ADMIN_WALLETS:0x97550031867e9483c6f9cff121e683eddeac6f5e}
app.auth.nonce-ttl-seconds=${APP_AUTH_NONCE_TTL_SECONDS:300}
app.auth.jwt-expiration-seconds=${APP_AUTH_JWT_EXPIRATION_SECONDS:3600}
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET:YXV0aF9qd3Rfc2VjcmV0X2Zvcl9kZXZlbG9wbWVudF9vbmx5XzEyMzQ1Njc4OTA=}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.security.rate-limit.max-requests=${APP_SECURITY_RATE_LIMIT_MAX_REQUESTS:20}
app.security.rate-limit.window-seconds=${APP_SECURITY_RATE_LIMIT_WINDOW_SECONDS:60}
app.security.ip.trust-x-forwarded-for=${APP_SECURITY_IP_TRUST_X_FORWARDED_FOR:false}
app.security.ip.auto-block-duration-minutes=${APP_SECURITY_IP_AUTO_BLOCK_MINUTES:30}
app.security.ip.auth-failure-window-seconds=${APP_SECURITY_IP_AUTH_FAILURE_WINDOW_SECONDS:300}
app.security.ip.auth-failure-threshold=${APP_SECURITY_IP_AUTH_FAILURE_THRESHOLD:20}
app.auth.email-otp-ttl-seconds=${APP_AUTH_EMAIL_OTP_TTL_SECONDS:600}
app.auth.email-ticket-ttl-seconds=${APP_AUTH_EMAIL_TICKET_TTL_SECONDS:900}
app.auth.email-otp-max-verify-attempts=${APP_AUTH_EMAIL_OTP_MAX_VERIFY_ATTEMPTS:5}
# Leave empty in production. Tests set app.auth.dev-fixed-otp in src/test/resources.
app.auth.dev-fixed-otp=${APP_AUTH_DEV_FIXED_OTP:}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/authdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_MIN_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
spring.datasource.hikari.auto-commit=${SPRING_DATASOURCE_AUTO_COMMIT:true}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.org.hibernate.orm.connections.pooling=ERROR
logging.level.org.hibernate.orm.deprecation=ERROR
# Structured HTTP audit lines (Step 7) — key=value style for log aggregation
logging.level.AUDIT_HTTP=INFO
logging.level.EMAIL_OTP_DEV=INFO
logging.pattern.level=%5p [reqId:%X{requestId}]
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] [reqId:%X{requestId:-}] %-5level %logger{40} - %msg%n
