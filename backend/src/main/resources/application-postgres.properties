spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/decentralized_auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
app.flyway.repair-before-migrate=false
app.auth.jwt-expiration-seconds=${APP_AUTH_JWT_EXPIRATION_SECONDS:3600}
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET:YXV0aF9qd3Rfc2VjcmV0X2Zvcl9kZXZlbG9wbWVudF9vbmx5XzEyMzQ1Njc4OTA=}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.security.rate-limit.max-requests=${APP_SECURITY_RATE_LIMIT_MAX_REQUESTS:20}
app.security.rate-limit.window-seconds=${APP_SECURITY_RATE_LIMIT_WINDOW_SECONDS:60}

spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_MIN_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
spring.datasource.hikari.auto-commit=${SPRING_DATASOURCE_AUTO_COMMIT:true}

spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.org.hibernate.orm.connections.pooling=ERROR
logging.level.org.hibernate.orm.deprecation=ERROR
logging.pattern.level=%5p [reqId:%X{requestId}]
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] [reqId:%X{requestId:-}] %-5level %logger{40} - %msg%n
